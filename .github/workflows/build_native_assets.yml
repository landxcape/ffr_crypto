name: Build and Release Native Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release dylib
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Rename and stage artifact
        run: |
          mkdir -p dist
          EXT="dylib"
          cp rust/target/${{ matrix.target }}/release/libffr_crypto.${EXT} dist/${{ matrix.target }}-libffr_crypto.${EXT}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-linux-and-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross compilation tools
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo install cross || true
      - name: Build target
        run: |
          cross build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml || cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/libffr_crypto.so dist/${{ matrix.target }}-libffr_crypto.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release DLL
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path rust/Cargo.toml
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp rust/target/x86_64-pc-windows-msvc/release/ffr_crypto.dll dist/x86_64-pc-windows-msvc-ffr_crypto.dll
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/*

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WebAssembly release
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path rust/Cargo.toml
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp rust/target/wasm32-unknown-unknown/release/ffr_crypto.wasm dist/ffr_crypto.wasm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-unknown-unknown
          path: dist/*

  release:
    needs: [build-darwin, build-linux-and-android, build-windows, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} release-assets/* --clobber
