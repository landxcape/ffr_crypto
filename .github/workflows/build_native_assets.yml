name: Build and Release Native Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release dylib
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Rename and stage artifact
        run: |
          mkdir -p dist
          EXT="dylib"
          cp rust/target/${{ matrix.target }}/release/libffr_crypto.${EXT} dist/${{ matrix.target }}-libffr_crypto.${EXT}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross compilation tools
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo install cross --git https://github.com/cross-rs/cross || true
      - name: Build target
        run: |
          cross build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml || cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/libffr_crypto.so dist/${{ matrix.target }}-libffr_crypto.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk
      - name: Build Android target
        working-directory: rust
        run: |
          cargo ndk -t ${{ matrix.abi }} build --release
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp rust/target/${{ matrix.target }}/release/libffr_crypto.so dist/${{ matrix.target }}-libffr_crypto.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release DLL
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path rust/Cargo.toml
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp rust/target/x86_64-pc-windows-msvc/release/ffr_crypto.dll dist/x86_64-pc-windows-msvc-ffr_crypto.dll
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/*

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WebAssembly release
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path rust/Cargo.toml
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp rust/target/wasm32-unknown-unknown/release/ffr_crypto.wasm dist/ffr_crypto.wasm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-unknown-unknown
          path: dist/*

  release:
    needs: [build-darwin, build-linux, build-android, build-windows, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Determine tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
      - name: Publish assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "Publishing assets to release tag: $TAG"
          gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes || gh release upload "$TAG" release-assets/* --clobber
