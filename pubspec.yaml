name: ffr_crypto
description: "A Flutter-first, Rust-powered cryptography package with native RSA, AEAD, hashing, KDF, ECC, compatibility primitives, and typed workflows."
version: 0.0.9
homepage: https://github.com/landxcape/ffr_crypto
repository: https://github.com/landxcape/ffr_crypto
issue_tracker: https://github.com/landxcape/ffr_crypto/issues
false_secrets:
  - /tool/interop/test_private_key.pem
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - cryptography
  - security
  - rust
  - encryption
  - webassembly

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: '>=1.2.1 <3.0.0'
  ffi: ^2.1.4
  hooks: ^2.0.2
  logging: ^1.3.0
  native_toolchain_c: ^0.19.1

dev_dependencies:
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  test: ^1.28.0
